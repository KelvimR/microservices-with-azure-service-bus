name: Dependency Review

on:
  pull_request:
    branches: 
      - main
      - develop

permissions:
  contents: read
  
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Dependency Review
        uses: actions/dependency-review-action@v4  
        with:
            fail-on-severity: high #faz o workflow falhar somente quando uma nova dependência introduz vulnerabilidade
            fail-on-scope: runtime #faz a action bloquear vulnerabilidades em dependências utilizadas durante a execução da aplicação.