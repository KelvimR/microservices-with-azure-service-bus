name: CodeQL Security Analysis

on:
  push:
    branches: 
      - main 
      - develop

  pull_request:
    branches: 
      - main
      - develop

  schedule:
    - cron: '0 3 * * 0'

permissions:
      actions: read
      contents: read
      security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true      
      
jobs:
  analyze:
    name: Analyze c#
    runs-on: ubuntu-latest    
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      
      - name: Display .NET information
        run: dotnet --info

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended 

      - name: Restore Mango dependencies
        run: dotnet restore Mango/Mango.slnx
    
      - name: Restore SampleAPI dependencies
        run: dotnet restore SampleAPI/SampleAPI.slnx

      - name: Build Mango
        run: > 
          dotnet build Mango/Mango.slnx 
          --configuration Release 
          --no-restore
          --no-logo

      - name: Build SampleAPI
        run: > 
          dotnet build SampleAPI/SampleAPI.slnx 
          --configuration Release 
          --no-restore
          --no-logo

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"